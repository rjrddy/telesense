[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telesense"
version = "0.1.0"
description = "Prototype multimodal (audio, video, text) behavioral analysis for telehealth sessions"
readme = "README.md"
requires-python = ">=3.10"
# Install app/backend/requirements.txt for the complete demo environment.
# `pip install -e .` makes telesense_ml importable without reinstalling the stack.

[tool.setuptools.packages.find]
where = ["src"]
